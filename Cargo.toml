[workspace]
resolver = "2"
members = ["crates/core", "crates/io", "crates/cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/niktimf/remnawave-healthcheck"

[workspace.dependencies]
anyhow = "1"
backon = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
openssh = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "net", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
webpki-roots = "1"
x509-parser = "0.18"
zip = { version = "2", default-features = false, features = ["deflate"] }
# dev
pretty_assertions = "1"
rstest = "0.26"
wiremock = "0.6"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
debug = "line-tables-only"

# Thin LTO: most of the win, a fraction of the link time. The tool waits on the
# network; `panic = "unwind"` stays so `Drop` guards (temp files) always run.
[profile.release]
lto = "thin"
strip = "debuginfo"
